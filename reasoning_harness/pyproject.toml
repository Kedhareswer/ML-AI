[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-system2"
version = "0.1.0"
description = "Scratch-trained maze planning with verified retries"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "numpy>=1.26"]

[project.optional-dependencies]
evidence = ["matplotlib>=3.8,<4", "playwright>=1.49,<2"]
docs = ["pillow>=10", "pdfplumber>=0.11", "pypdfium2>=4.30", "python-docx>=1.1", "openpyxl>=3.1"]
parsebench = ["parse-bench[fast]>=1.0.4; python_version >= '3.12'"]
games = ["chess>=1.10,<2", "zstandard>=0.22", "gensim>=4.3,<5", "pyarrow>=15", "nltk>=3.8"]

[project.scripts]
sys2 = "sys2.cli:main"
arena = "arena.cli:main"
docparse = "docparse.cli:main"

[tool.setuptools.packages.find]
include = ["sys2*", "arena*", "docparse*"]

[tool.setuptools.package-data]
sys2 = ["*.html"]
arena = ["*.html", "puzzles/*.txt"]
docparse = ["*.html", "data/*.txt"]
